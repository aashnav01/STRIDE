# Render Blueprint for Stride.
#
# VITE_API_URL and ALLOWED_ORIGINS are deliberately NOT wired with
# fromService. That returns Render's INTERNAL hostname, which the browser
# cannot resolve — the frontend's JavaScript runs on the user's device,
# outside Render's private network, so it needs the public .onrender.com
# URL. Render also appends a random suffix when a service name is taken
# (hence the old koa-backend-ygct), so the public URL is not predictable
# from the blueprint either.
#
# Both are therefore `sync: false`: Render prompts for them at deploy time,
# and you paste each service's real public URL. See DEPLOY.md.
#
# PERSISTENCE — read this before demoing:
# Render's filesystem is ephemeral. On the free plan the screening database
# is wiped by every deploy, restart, and sleep/wake cycle. The app is
# offline-first, so each phone keeps its own copy in IndexedDB and nothing
# is lost on the device — but the server-side dashboard resets.
# To make it durable, switch the backend to `plan: starter` and uncomment
# the disk block. Disks are not available on the free plan.

services:
  - type: web
    name: stride-backend
    # docker, not the native python runtime: MediaPipe needs libGLESv2 and
    # libEGL, which the native runtime lacks and cannot install
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # disk:                       # requires plan: starter or above
    #   name: stride-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      # with a disk attached, point this at /var/data/screenings.db
      - key: SCREENINGS_DB
        value: /var/data/screenings.db
      # the frontend's public URL, e.g. https://stride-frontend-ab12.onrender.com
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: stride-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # the backend's public URL, e.g. https://stride-backend-cd34.onrender.com
      - key: VITE_API_URL
        sync: false
    routes:
      # single-page app: unmatched paths resolve to the shell
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # the service worker must never be cached, or an old shell pins
      # itself on the device and the app stops updating
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
