services:
  - type: web
    name: koa-backend
    runtime: docker
    rootDir: backend

  - type: web
    name: koa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://koa-backend-ygct.onrender.com